name: Sync Ghost posts to GitHub Pages and Blogger

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish new Ghost posts
        env:
          GHOST_URL: ${{ secrets.GHOST_URL }}
          GHOST_CONTENT_API_KEY: ${{ secrets.GHOST_CONTENT_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_OAUTH_CLIENT_JSON: ${{ secrets.BLOGGER_OAUTH_CLIENT_JSON }}
          BLOGGER_OAUTH_TOKEN_JSON: ${{ secrets.BLOGGER_OAUTH_TOKEN_JSON }}
          BLOGGER_OAUTH_CLIENT_FILE: ${{ runner.temp }}/blogger-client.json
          BLOGGER_OAUTH_TOKEN_FILE: ${{ runner.temp }}/blogger-token.json
          PUBLISH_STATE_FILE: .github/ghost-blog-sync-state.json
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for name, env_name in (("BLOGGER_OAUTH_CLIENT_FILE", "BLOGGER_OAUTH_CLIENT_JSON"), ("BLOGGER_OAUTH_TOKEN_FILE", "BLOGGER_OAUTH_TOKEN_JSON")):
              value = os.environ.get(env_name, "")
              if value:
                  path = Path(os.environ[name])
                  path.write_text(value, encoding="utf-8")
                  path.chmod(0o600)
          PY
          python publish_pipeline.py --git-push
